name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so commit-message checks can see the range

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Shell lint (shellcheck)
        run: git ls-files '*.sh' '.githooks/*' | xargs shellcheck

      - name: JS syntax (site)
        run: git ls-files -- docs/site | grep -E '\.js$' | xargs -r -n1 node --check

      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: JSON validity
        run: |
          files=$(git ls-files '*.json')
          for f in $files; do python3 -m json.tool "$f" >/dev/null && echo "ok $f"; done

      - name: Blueprint schema conformance
        run: node scripts/validate-blueprint.js

      - name: ROADMAP.md in sync with JSON backlog
        run: python3 scripts/gen_roadmap.py --check

      - name: Markdown links
        run: python3 scripts/check_links.py

      - name: Commit messages (Conventional Commits)
        run: |
          chmod +x .githooks/commit-msg
          # Validate every commit on the PR/branch that isn't on main.
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="HEAD~1"; fi
          for sha in $(git rev-list "$base"..HEAD); do
            git log -1 --format='%B' "$sha" > /tmp/msg
            .githooks/commit-msg /tmp/msg || { echo "Bad message in $sha"; exit 1; }
          done
